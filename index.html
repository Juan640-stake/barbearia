<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3340E6">
<title>Barbearia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><i class="mark" aria-hidden="true"></i><span id="brand">Barbearia</span></div>
    <span class="demo">Demonstração</span>
  </header>
  <main id="main"></main>
</div>
<div class="bar" id="bar" hidden><div class="bar-in" id="barin"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="nav" aria-label="Áreas do aplicativo"><div class="nav-in">
  <button class="nt" data-tab="agendar" id="t-agendar"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><span>Agendar</span></button>
  <button class="nt" data-tab="meu" id="t-meu"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Meu horário</span></button>
  <button class="nt" data-tab="painel" id="t-painel"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span><span>Barbeiro</span></button>
</div></nav>

<script src="js/app.js"></script>
</body>
</html>
